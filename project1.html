<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碳擎3.0产品碳数据管理平台 - 基础信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: white;
            color: #111827;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
        }
        
        .sidebar {
            position: fixed;
            left: 2rem;
            top: 50%;
            transform: translateY(-50%);
            height: auto;
            width: 130px;
            background-color: white;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            box-shadow: 4px 4px 20px rgba(55,99,170,.05),-4px -4px 20px rgba(55,99,170,.05);
            padding: 4px 0;
            display: flex;
            flex-direction: column;
            gap: 0;
            z-index: 1000;
        }
        
        .nav-item {
            padding: 0.75rem 14px;
            color: #181818;
            text-decoration: none;
            transition: all 0.2s ease;
            border-left: 2px solid transparent;
            font-size: 0.875rem;
            height: 40px;
            display: flex;
            align-items: center;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        .nav-item:hover {
            color: #3b82f6;
        }
        
        .nav-item.active {
            color: #3b82f6;
            border-left: 2px solid #3b82f6;
            font-weight: 500;
        }
        
        .nav-item.top {
            padding: 0.75rem 14px;
            height: 40px;
            display: flex;
            align-items: center;
        }
        
        .container {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
            margin: 0 auto;
        }
        
        .project-image {
            width: 100%;
            display: block;
            margin: 0 auto 40px;
        }
        
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                transform: none;
                width: 100%;
                height: auto;
                flex-direction: row;
                justify-content: space-around;
                align-items: center;
                box-shadow: 0 2px 10px rgba(55,99,170,.1);
                z-index: 1000;
            }
            
            .nav-item {
                height: auto;
                padding: 0.5rem 0.75rem;
                font-size: 0.75rem;
                border-left: none;
                border-bottom: 2px solid transparent;
            }
            
            .nav-item.active {
                border-left: none;
                border-bottom: 2px solid #3b82f6;
            }
            
            .nav-item.top {
                display: none;
            }
            
            .container {
                padding: 2rem 1rem;
                margin-top: 60px;
            }
            
            .project-image {
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <a href="#section-1" class="nav-item active" data-section="section-1">项目基础信息</a>
        <a href="#section-2" class="nav-item" data-section="section-2">重构目标</a>
        <a href="#section-3" class="nav-item" data-section="section-3">原子样式</a>
        <a href="#section-4" class="nav-item" data-section="section-4">页面展示</a>
        <a href="#top" class="nav-item top">回到顶部 ↑</a>
    </nav>
    
    <div class="container">
        <div id="section-1" class="project-section">
            <img src="images/home/碳擎3.0产品碳数据管理平台/1基础信息.png" alt="基础信息" class="project-image">
        </div>
        <div id="section-2" class="project-section">
            <img src="images/home/碳擎3.0产品碳数据管理平台/2重构目标.png" alt="重构目标" class="project-image">
        </div>
        <div id="section-3" class="project-section">
            <img src="images/home/碳擎3.0产品碳数据管理平台/3原子样式.png" alt="原子样式" class="project-image">
        </div>
        <div id="section-4" class="project-section">
            <img src="images/home/碳擎3.0产品碳数据管理平台/4页面展示.png" alt="页面展示" class="project-image">
        </div>
    </div>
    
    <script>
        const navItems = document.querySelectorAll('.sidebar .nav-item[data-section]');
        const sections = document.querySelectorAll('.project-section');
        
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                const sectionId = item.getAttribute('href').substring(1);
                const section = document.getElementById(sectionId);
                if (section) {
                    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
        
        function updateActiveNav() {
            let currentSection = '';
            
            sections.forEach(section => {
                const rect = section.getBoundingClientRect();
                if (rect.top <= 150) {
                    currentSection = section.id;
                }
            });
            
            navItems.forEach(item => {
                item.classList.remove('active');
                if (item.getAttribute('data-section') === currentSection) {
                    item.classList.add('active');
                }
            });
        }
        
        window.addEventListener('scroll', updateActiveNav);
        updateActiveNav();
    </script>
</body>
</html>
